[project]
name = "talo-cli"
version = "0.1.0"
description = "Talo - 여러 AI와 함께 작업을 이어가는 개발자 CLI 에이전트"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Talo" }]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
talo = "talo.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
